pre-commit:
  parallel: true
  commands:
    cspell:
      glob: '**/*.{ts,tsx,js,jsx,md}'
      run: npx cspell lint --no-progress --no-must-find-files --config ./.config/cspell.json {staged_files}
    markdownlint:
      glob: '**/*.md'
      run: npx markdownlint-cli2 --config ./.config/.markdownlint-cli2.jsonc {staged_files}
    yamllint:
      glob: '**/*.{yml,yaml}'
      exclude: 'pnpm-lock.yaml'
      run: npx yamllint -c ./.config/yamllint.yml {staged_files}
    betterleaks:
      run: betterleaks git . --staged --verbose --config ./.config/gitleaks.toml
      skip:
        - merge
        - rebase
  jobs:
    # Format only, then check. Never `ultracite fix` here: oxlint marks
    # prefer-nullish-coalescing / prefer-dom-node-dataset fixes as safe,
    # but they change runtime behavior (`'' || x` vs `'' ?? x`).
    - name: ultracite
      group:
        piped: true
        jobs:
          - run: pnpm exec oxfmt --no-error-on-unmatched-pattern --write {staged_files}
            glob: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mts', '*.json', '*.jsonc', '*.css']
            stage_fixed: true
          - run: pnpm exec ultracite check {staged_files}
            glob: ['*.js', '*.jsx', '*.ts', '*.tsx', '*.mts']

commit-msg:
  commands:
    commitlint:
      run: npx commitlint --config ./.config/commitlint.config.mjs --edit {1}
